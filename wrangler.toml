name = "openlist-ts"
main = "src/worker.ts"
compatibility_date = "2024-04-05"
compatibility_flags = ["nodejs_compat"]
assets = { directory = "./public", binding = "ASSETS" }

[vars]
ENVIRONMENT = "production"
# Database backend: "true" = D1 (default), "false" = PostgreSQL.
# With USE_D1=false the worker connects to the HYPERDRIVE binding first
# (Cloudflare), falling back to PG_ADDRS for external PostgreSQL (cross-cloud).
USE_D1 = "true"
# PG_ADDRS = "postgres://user:pass@host:5432/dbname"

# To use PostgreSQL on Cloudflare, create a Hyperdrive instance and add its ID:
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<your-hyperdrive-id>"

[[d1_databases]]
binding = "DB"
database_name = "openlist-db"
# database_id is left empty so that the one-click "Deploy to Cloudflare
# Workers" flow can create a fresh D1 database in the deployer's account.
# For manual deployment, run `npx wrangler d1 create openlist-db` and paste
# the returned database_id here.
database_id = ""
