# Local development config.
# wrangler dev requires a concrete database_id even in --local mode, while
# the main wrangler.toml leaves it empty for the one-click deploy flow.
# Run local dev with: npm run dev   (uses this file)

name = "openlist-ts"
main = "src/worker.ts"
compatibility_date = "2024-04-05"
compatibility_flags = ["nodejs_compat"]
assets = { directory = "./public", binding = "ASSETS" }

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "openlist-db"
database_id = "f7b96b7c-e5c9-43f7-a69d-64ca9f38fb62"
