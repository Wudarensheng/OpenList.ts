# Local development config.
# wrangler dev requires a concrete database_id even in --local mode, while
# the main wrangler.toml leaves it empty for the one-click deploy flow.
# Run local dev with: npm run dev   (uses this file)

name = "openlist-ts"
main = "src/worker.ts"
compatibility_date = "2024-04-05"
compatibility_flags = ["nodejs_compat"]
assets = { directory = "./public", binding = "ASSETS" }

[vars]
ENVIRONMENT = "production"
# Database backend: "true" = D1 (default), "false" = PostgreSQL.
# With USE_D1=false the worker connects to the HYPERDRIVE binding first
# (Cloudflare), falling back to PG_ADDRS for external PostgreSQL (cross-cloud).
USE_D1 = "true"
# PG_ADDRS = "postgres://user:pass@host:5432/dbname"

[[d1_databases]]
binding = "DB"
database_name = "openlist-db"
database_id = "f7b96b7c-e5c9-43f7-a69d-64ca9f38fb62"
